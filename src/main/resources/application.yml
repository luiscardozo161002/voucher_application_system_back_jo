spring:
  application:
    name: solicitudes-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solicitudes}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: America/Mexico_City

  flyway:
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

server:
  port: ${PORT:8081}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/pdf,text/html
    min-response-size: 2048

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:c29saWNpdHVkZXMtc2VjcmV0LWp1YXJlei1kZS1vcmllbnRlLTIwMjYtc2VjdXJl}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ${JWT_ISSUER:solicitudes-api}
    audience: ${JWT_AUDIENCE:solicitudes-client}
  refresh-cookie:
    name: refresh_token
    same-site: ${COOKIE_SAME_SITE:Strict}
    secure: ${COOKIE_SECURE:true}
    path: /api/v1/auth

  security:
    max-login-attempts: 5
    lockout-minutes: 15
  requests:
    max-items-per-request: 8
  pagination:
    max-page-size: 1000

  rate-limit:
    enabled: true

  timezone: America/Mexico_City

  # Datos institucionales — aparecen en el PDF del pedido
  company:
    name: ${COMPANY_NAME:JUAREZ DE ORIENTE S.A. DE C.V.}
    address: ${COMPANY_ADDRESS:AV. TULANCINGO NO. 103 SAN MIGUEL VINDHO,}
    city-line: ${COMPANY_CITY_LINE:MPIO. DE TULA DE ALLENDE, HIDALGO.}
    postal-code: ${COMPANY_POSTAL_CODE:42842}
    rfc: ${COMPANY_RFC:JOR070518U13}
    phone: ${COMPANY_PHONE:(01-773) 78-5-04-97}
    extension: ${COMPANY_EXTENSION:125 - 126}
    document-code: ${COMPANY_DOCUMENT_CODE:CJ-FA-44 REV. 0}
    # Lista de autorizadores separados por coma
    authorizers: ${COMPANY_AUTHORIZERS:Sr. Miguel Angel Luna,Gerencia General}

  # Contraseñas iniciales de los seeds de desarrollo
  seeds:
    admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
    capturista-password: ${SEED_CAPTURISTA_PASSWORD:Capturista1!}
    demo-data: ${SEED_DEMO_DATA:false}

info:
  app:
    name: Sistema de Solicitudes
    version: 1.0.0
    description: API REST para gestion de solicitudes de compra

logging:
  level:
    mx.juarezdeoriente: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"